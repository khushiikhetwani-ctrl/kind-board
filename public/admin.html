<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kindboard Moderation</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
  <script type="module" src="/admin.js"></script>
</head>
<body class="admin">
  <div class="admin-wrap">
    <header class="admin-head">
      <h1 class="serif">Kindboard moderation</h1>
      <form id="keyForm" class="keybox-row">
        <input id="adminKey" type="password" placeholder="Moderator key" autocomplete="current-password">
        <button class="btn sm primary">Unlock</button>
      </form>
    </header>
    <p class="hint"><b>Waiting for approval</b> items (links, contact details, hand-made stickers, or posts several people reported) are only visible to their writer until you approve them. <b>Decline</b> quietly removes one; <b>+ strike</b> also counts against the writer (2 strikes pause them).</p>
    <p id="err" class="form-error" hidden></p>
    <div id="list" class="admin-list"></div>
  </div>
</body>
</html>
